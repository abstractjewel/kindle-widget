<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Courier+Prime:ital@0;1&family=Crimson+Pro:ital@0;1&family=Dancing+Script:wght@400;600&family=EB+Garamond:ital@0;1&family=Homemade+Apple&family=Karla:wght@400;600&family=Libre+Baskerville:ital@0;1&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Playfair+Display:ital@0;1&family=Quicksand:wght@400;500;600;700&family=Special+Elite&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3ede4; --surface:#fbf8f3; --paper:#fffdf8; --ink:#3b2f25; --muted:#8a7a6a;
  --accent:#8e7051; --accent-ink:#ffffff; --border:#e2d8ca;
  --outer-bg:var(--bg); --outer-ink:var(--ink); --outer-muted:var(--muted);
  --app-font:'Quicksand', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--app-font);background:var(--outer-bg);color:var(--outer-ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:960px;margin:0 auto;padding:18px 16px 28px}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.soft{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:transparent;color:#b5483f;border:1px solid currentColor}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.icon-btn svg,.btn svg,.tb svg{width:16px;height:16px}
.ghost{background:none;border:none;color:var(--outer-muted);font-size:12px;padding:6px 8px;border-radius:8px}
.ghost:hover{color:var(--outer-ink)}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.shelf-title{font-size:22px;font-weight:600;margin:0;letter-spacing:.01em}
.top-actions{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
.tab{border:1px solid transparent;background:none;color:var(--outer-muted);border-radius:999px;padding:5px 12px;font-size:13px}
.tab.on{background:var(--surface);border-color:var(--border);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 20px}
.card{position:relative;cursor:pointer;text-align:center}
.cover{position:relative;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;background-size:cover;background-position:center;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 22px -12px rgba(0,0,0,.55);overflow:hidden;transition:transform .25s ease}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:9%;
  background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.06) 70%,rgba(255,255,255,.14))}
.cover::after{content:"";position:absolute;top:3px;bottom:3px;right:0;width:3px;border-radius:0 3px 3px 0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.55) 0 1px,rgba(0,0,0,.08) 1px 2px)}
.card:hover .cover{transform:translateY(-4px) rotate(-.7deg)}
.cover-label{position:absolute;top:24%;left:20%;right:11%;background:rgba(255,253,248,.92);color:#3b2f25;
  padding:10px 8px;border-radius:3px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;line-height:1.15;word-break:break-word}
.lock{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.35);color:#fff}
.lock svg{width:12px;height:12px}
.card-title{font-size:13px;font-weight:600;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:11px;color:var(--outer-muted);margin-top:2px}
.cat-pill{display:inline-block;margin-top:5px;font-size:10px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--outer-ink)}
.card-edit{position:absolute;top:6px;left:12%;width:26px;height:26px;border-radius:50%;border:none;display:grid;place-items:center;
  background:rgba(255,255,255,.85);color:#3b2f25;opacity:0;transition:opacity .15s}
.card-edit svg{width:14px;height:14px}
.card:hover .card-edit,.card-edit:focus-visible{opacity:1}
@media (hover:none){.card-edit{opacity:1}}
.empty{text-align:center;padding:60px 20px;color:var(--outer-muted)}
.empty p{margin:0 0 16px}
.banner{background:#fbe9d8;color:#6b3f16;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;align-items:center;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:5px 8px;color:var(--ink);max-width:100%;box-shadow:0 4px 14px -10px rgba(0,0,0,.4)}
.tb{width:30px;height:30px;display:grid;place-items:center;border:none;background:none;border-radius:8px;color:var(--ink);font-size:14px}
.tb:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tb.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.tb-select{height:28px;border:1px solid var(--border);background:var(--paper);border-radius:8px;font-size:12px;padding:0 4px;color:var(--ink);max-width:118px}
.sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.swatch-btn{position:relative;width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.swatch-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.swatch-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.date-chip{display:inline-flex;align-items:center;gap:6px;border:none;background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:13px}
.date-chip svg{width:14px;height:14px}
.date-wrap{position:relative}
.date-input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.page-row{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.arrow{flex:none;border:none;background:none;color:var(--outer-muted);font-size:30px;line-height:1;padding:8px 4px}
.arrow:disabled{opacity:.25;cursor:default}
.paper{--rule:color-mix(in srgb,var(--accent) 40%,transparent);--page-font:'Lora',Georgia,serif;--page-size:15px;
  position:relative;width:min(600px,100%);min-height:600px;background-color:var(--paper);color:var(--ink);
  border-radius:3px 12px 12px 3px;padding:28px 30px 40px 38px;
  box-shadow:inset 6px 0 10px -8px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.05),0 16px 30px -18px rgba(0,0,0,.45);
  border-right:5px solid color-mix(in srgb,var(--accent) 55%,var(--paper))}
.paper.p-lined{background-image:linear-gradient(180deg,transparent 27px,var(--rule) 27px,var(--rule) 28px);background-size:100% 28px}
.paper.p-grid{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:28px 28px}
.paper.p-dotted{background-image:radial-gradient(circle,var(--rule) 1.3px,transparent 1.6px);background-size:28px 28px;background-position:-14px -14px}
.subject{display:block;width:100%;border:none;background:transparent;outline:none;font-family:var(--page-font);font-size:calc(var(--page-size) * 1.3);
  font-weight:600;height:56px;line-height:56px;padding:0;color:var(--ink)}
.subject::placeholder{color:var(--muted);opacity:.6}
.content{font-family:var(--page-font);font-size:var(--page-size);line-height:28px;outline:none;min-height:504px;word-wrap:break-word}
.content:empty::before{content:attr(data-placeholder);color:var(--muted);opacity:.6}
.content p,.content div{margin:0}
.content h1{font-size:1.9em;line-height:56px;margin:0;font-weight:600}
.content h2{font-size:1.4em;line-height:28px;margin:0;font-weight:600}
.content h3{font-size:1.15em;line-height:28px;margin:0;font-weight:600}
.content::after{content:"";display:table;clear:both}
.pic{max-width:100%;height:auto;border-radius:6px;cursor:pointer}
.pic-left{float:left;margin:6px 16px 8px 0}
.pic-right{float:right;margin:6px 0 8px 16px}
.pic-center{display:block;float:none;margin:8px auto}
.pic.sel{outline:2px solid var(--accent);outline-offset:2px}
.page-foot{display:flex;align-items:center;justify-content:space-between;width:min(600px,100%);font-size:12px;color:var(--outer-muted)}

/* stickers */
.sticker-layer{position:absolute;inset:0;pointer-events:none}
.sticker{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.sticker img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.sticker .h,.sticker .rot,.sticker .del{display:none}
.sticker.sel{outline:1.5px dashed var(--accent);outline-offset:3px}
.sticker.sel .h{display:block;position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.h.tl{left:-9px;top:-9px;cursor:nwse-resize}.h.tr{right:-9px;top:-9px;cursor:nesw-resize}
.h.bl{left:-9px;bottom:-9px;cursor:nesw-resize}.h.br{right:-9px;bottom:-9px;cursor:nwse-resize}
.sticker.sel .rot,.sticker.sel .del{display:grid;place-items:center;position:absolute;left:50%;width:24px;height:24px;border-radius:50%;
  border:none;background:var(--accent);color:var(--accent-ink);transform:translateX(-50%)}
.sticker.sel .rot{top:-38px;cursor:grab}
.sticker.sel .del{bottom:-38px;background:#b5483f;color:#fff}
.rot svg,.del svg{width:13px;height:13px}

/* popovers, modals, toast */
.pop{position:fixed;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:10px;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.45);font-size:12px}
.pop-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pop-label{color:var(--muted);margin:2px 0 6px}
.paper-opt{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--border);background:var(--paper);border-radius:8px;padding:6px;font-size:11px;color:var(--ink)}
.paper-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.paper-opt i{display:block;width:34px;height:26px;border-radius:3px;background-color:var(--paper);border:1px solid var(--border);--rule:var(--muted)}
.paper-opt i.p-lined{background-image:linear-gradient(180deg,transparent 6px,var(--rule) 6px,var(--rule) 7px);background-size:100% 7px}
.paper-opt i.p-grid{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:7px 7px}
.paper-opt i.p-dotted{background-image:radial-gradient(circle,var(--rule) .8px,transparent 1px);background-size:7px 7px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);padding:0}
.dot.on{box-shadow:0 0 0 2px var(--accent)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal h2{margin:0 0 14px;font-size:17px}
.field{margin-bottom:16px}
.field>label,.field-title{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.text-in{width:100%;border:1px solid var(--border);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink)}
.cover-edit{display:flex;gap:14px;align-items:flex-start}
.cover-edit .cover{width:84px;flex:none}
.cover-edit .cover-label{font-size:11px;padding:6px 4px}
.cover-tools{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.modal-actions .right{display:flex;gap:8px;margin-left:auto}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.theme-opt{border:1px solid var(--border);border-radius:10px;padding:6px;font-size:11px;text-align:center;background:var(--paper);color:var(--ink)}
.theme-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-opt span{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:4px;border:1px solid rgba(0,0,0,.08)}
.theme-opt span b{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--border);pointer-events:none;transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(16px)}
.link-row{display:flex;gap:6px;margin-bottom:6px}
.link-row input{flex:1;font-size:11px;padding:7px 9px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:6px 0 18px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent)}
.pin-dots i.f{background:var(--accent)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.key{height:52px;border-radius:14px;border:1px solid var(--border);background:var(--paper);font-size:19px;color:var(--ink)}
.key.blank{visibility:hidden}
.pin-modal{text-align:center}
.pin-err{color:#b5483f;font-size:12px;min-height:16px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:12px;z-index:60}
@media (max-width:560px){
  .paper{padding:28px 18px 36px 24px;min-height:520px}
  .arrow{display:none}
  .tb-select{max-width:92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app"></div>

<script>
/* =====================================================================

   Everything saves in this browser (IndexedDB). Use Settings → Backup.

const THEMES = {

  rosewater:{name:'Rosewater', dark:false, c:{bg:'#f6eeee',surface:'#fdf8f7',paper:'#fffcfb',ink:'#4a3236',muted:'#9b8085',accent:'#b98b92','accent-ink':'#ffffff',border:'#ecdcdc'}},

  cherry:   {name:'Cherry',    dark:false, c:{bg:'#f6e9e7',surface:'#fdf6f5',paper:'#fffbfa',ink:'#4a2422',muted:'#9b6b67',accent:'#a8433d','accent-ink':'#ffffff',border:'#efd5d1'}},

  cocoa:    {name:'Cocoa',     dark:true,  c:{bg:'#2a221d',surface:'#352b25',paper:'#3e332c',ink:'#efe4d8',muted:'#b3a191',accent:'#c49a73','accent-ink':'#221a15',border:'#4d4037'}},
  midnight: {name:'Midnight',  dark:true,  c:{bg:'#1c2030',surface:'#252a3c',paper:'#2c3247',ink:'#e6e8f2',muted:'#9aa0b8',accent:'#8ea2e0','accent-ink':'#161a28',border:'#3a4159'}},
  forest:   {name:'Forest',    dark:true,  c:{bg:'#1e2620',surface:'#27302a',paper:'#2e3831',ink:'#e4ece4',muted:'#9db09f',accent:'#8fb58f','accent-ink':'#162018',border:'#3c483e'}},
  plum:     {name:'Plum',      dark:true,  c:{bg:'#2a1f2b',surface:'#352837',paper:'#3e2f40',ink:'#f0e4ef',muted:'#b69bb3',accent:'#c98bbf','accent-ink':'#21171f',border:'#4d3c50'}},
  ink:      {name:'Ink',       dark:true,  c:{bg:'#1d1d1d',surface:'#262626',paper:'#2e2e2e',ink:'#ececec',muted:'#a0a0a0',accent:'#d0b48a','accent-ink':'#1d1d1d',border:'#3d3d3d'}}
};
const EDITOR_FONTS = [
  ['Lora','serif'],['EB Garamond','serif'],['Cormorant Garamond','serif'],['Libre Baskerville','serif'],
  ['Crimson Pro','serif'],['Playfair Display','serif'],['Nunito','sans-serif'],['Quicksand','sans-serif'],
  ['Karla','sans-serif'],['Work Sans','sans-serif'],['Caveat','cursive'],['Patrick Hand','cursive'],
  ['Homemade Apple','cursive'],['Dancing Script','cursive'],['Special Elite','monospace'],['Courier Prime','monospace']
];
const APP_FONTS = [['Quicksand','sans-serif'],['Nunito','sans-serif'],['Work Sans','sans-serif'],['Lora','serif'],['Cormorant Garamond','serif'],['Courier Prime','monospace']];
const LINE_COLORS = [
  ['Theme','color-mix(in srgb, var(--accent) 40%, transparent)'],
  ['Pencil','rgba(128,128,128,.38)'],['Blush','rgba(214,135,148,.45)'],['Sage','rgba(118,160,112,.45)'],
  ['Sky','rgba(104,148,204,.45)'],['Lilac','rgba(158,128,204,.45)'],['Butter','rgba(214,176,72,.55)']
];
const COVER_COLORS = ['#8e7051','#3d332c','#b98b92','#7d8f69','#6f93a3','#c9a14a','#5b4a6b','#2c3247'];

/* ---------------- storage (IndexedDB, in-memory fallback) ---------------- */
let dbPromise = null, storageOK = true;
const memory = new Map();
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('journal-shelf', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbPromise;
}
function req(p){ return new Promise((res, rej) => { p.onsuccess = () => res(p.result); p.onerror = () => rej(p.error); }); }
async function kvSet(key, val){
  memory.set(key, val);
  try {
    const db = await openDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  } catch (e) { markStorageFailed(e); }
}
async function kvDel(key){
  memory.delete(key);
  try { const db = await openDB(); await req(db.transaction('kv', 'readwrite').objectStore('kv').delete(key)); }
  catch (e) { markStorageFailed(e); }
}
async function kvLoadAll(){
  try {
    const db = await openDB();
    const store = db.transaction('kv').objectStore('kv');
    const [keys, vals] = await Promise.all([req(store.getAllKeys()), req(store.getAll())]);
    const out = new Map(); keys.forEach((k, i) => out.set(k, vals[i])); return out;
  } catch (e) { markStorageFailed(e); return memory; }
}
function markStorageFailed(e){
  console.warn('Storage problem:', e);
  if (storageOK) { storageOK = false; render(); }
  if (e && e.name === 'QuotaExceededError') toast('Storage is full. Try smaller photos, or back up and delete old journals.');
}

function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function friendlyDate(iso){
  if (!iso) return 'Add date';
  const d = new Date(iso + 'T00:00'), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric'});
}
function newPage(){ return {id:uid(), date:todayISO(), subject:'', html:'', stickers:[]}; }

const saveTimers = {};
function saveJournal(j, now){
  j.updated = Date.now();
  clearTimeout(saveTimers[j.id]);
  const run = () => kvSet('j:' + j.id, j);
  if (now) return run();
  saveTimers[j.id] = setTimeout(run, 400);
}
function flushSaves(){ Object.keys(saveTimers).forEach(id => { clearTimeout(saveTimers[id]); const j = S.journals.find(x => x.id === id); if (j) kvSet('j:' + id, j); delete saveTimers[id]; }); }
function saveSettings(){ kvSet('settings', S.settings); }

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });

/* ---------------- helpers ---------------- */
function sanitize(html){
  const t = document.createElement('template'); t.innerHTML = html || '';
  t.content.querySelectorAll('script,iframe,object,embed,link,meta,style,form,input,button,textarea,select,svg,math').forEach(n => n.remove());
  t.content.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase();
      if (n.startsWith('on') || n === 'srcset' || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
    });
    if (el.tagName === 'IMG' && !isImgData(el.getAttribute('src'))) el.remove();
  });
  return t.innerHTML;
}
async function sha(text){
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for (const ch of text) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'x' + h;
}
const pinHash = (pin, id) => sha('journal-shelf:' + id + ':' + pin);

function pickFile(accept){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.style.display = 'none';
    i.onchange = () => { res(i.files[0] || null); i.remove(); };
    document.body.appendChild(i); i.click();
  });
}
async function shrinkImage(file, max, keepAlpha){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function closePop(){ document.querySelector('.pop')?.remove(); }
function openPop(anchor, html, onClick){
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth;
  p.style.top = Math.min(window.innerHeight - p.offsetHeight - 8, r.bottom + 6) + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  p.addEventListener('mousedown', e => { if (!e.target.closest('input,select')) e.preventDefault(); });
  p.addEventListener('click', e => onClick(e, p));
  return p;
}
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.pop') && !e.target.closest('[data-pop]')) closePop();
});
function modal(html, setup){
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  o.addEventListener('pointerdown', e => { if (e.target === o) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(o);
  setup(o.querySelector('.modal'), close);
  return close;
}

/* ---------------- theme ---------------- */
function applyTheme(){
  const s = S.settings, t = THEMES[s.theme] || THEMES.maple, st = document.documentElement.style;
  Object.entries(t.c).forEach(([k, v]) => st.setProperty('--' + k, v));
  st.setProperty('--app-font', fontStack(s.appFont));
  st.setProperty('--outer-bg', s.transparent ? 'transparent' : s.darkPage ? '#191919' : 'var(--bg)');
  const light = s.darkPage || (!s.transparent && t.dark);
  st.setProperty('--outer-ink', s.darkPage ? '#ebe5de' : s.transparent ? '#37352f' : 'var(--ink)');
  st.setProperty('--outer-muted', s.darkPage ? '#a59d94' : s.transparent ? '#7d7a75' : 'var(--muted)');
  document.documentElement.style.colorScheme = light ? 'dark' : 'light';
}

/* ---------------- content editing ---------------- */
let savedRange = null, selImg = null;
const contentEl = () => app.querySelector('.content');
document.addEventListener('selectionchange', () => {
  const c = contentEl(), sel = getSelection();
  if (c && sel.rangeCount && c.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
});
function restoreRange(){
  const c = contentEl(); if (!c) return;
  c.focus({preventScroll:true});
  const sel = getSelection(); sel.removeAllRanges();
  if (savedRange && c.contains(savedRange.startContainer)) sel.addRange(savedRange);
  else { const r = document.createRange(); r.selectNodeContents(c); r.collapse(false); sel.addRange(r); }
}
function contentChanged(){
  const j = J(), c = contentEl(); if (!j || !c) return;
  j.pages[S.page].html = c.innerHTML; saveJournal(j);
}
function exec(cmd, val){ restoreRange(); document.execCommand(cmd, false, val); contentChanged(); }
function hasSelection(){ restoreRange(); const s = getSelection(); return s.rangeCount && !s.isCollapsed; }

function bindContent(c){
  c.addEventListener('input', contentChanged);
  c.addEventListener('paste', e => {
    const text = e.clipboardData?.getData('text/plain');
    if (text != null) { e.preventDefault(); document.execCommand('insertText', false, text); }
  });
  c.addEventListener('keyup', syncBlockSelect);
  c.addEventListener('mouseup', syncBlockSelect);
  c.addEventListener('click', e => {
    const img = e.target.closest('img.pic');
    if (img) { e.preventDefault(); selectImage(img); }
  });
}
function syncBlockSelect(){
  const sel = app.querySelector('[data-ctl="block"]'); if (!sel) return;
  const v = (document.queryCommandValue('formatBlock') || '').toLowerCase().replace(/[<>]/g, '');
  sel.value = ['h1','h2','h3'].includes(v) ? v : 'p';
}
function selectImage(img){
  app.querySelectorAll('img.pic.sel').forEach(i => i.classList.remove('sel'));
  img.classList.add('sel'); selImg = img;
  const pos = img.classList.contains('pic-left') ? 'left' : img.classList.contains('pic-center') ? 'center' : 'right';
  openPop(img, `
    <div class="pop-label">Photo position</div>
    <div class="pop-row" style="margin-bottom:10px">
      ${['left','center','right'].map(v => `<button class="chip ${pos === v ? 'on' : ''}" data-img="pos" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}

async function addSticker(){

  const j = J(), p = j.pages[S.page], layer = app.querySelector('.sticker-layer');

app.addEventListener('pointerdown', e => {
  const el = e.target.closest('.sticker');
  if (!el) { if (selSticker) { selSticker = null; renderStickers(); } return; }
  const j = J(), p = j.pages[S.page], s = p.stickers.find(x => x.id === el.dataset.sid); if (!s) return;
  if (e.target.closest('[data-del]')) {
    e.preventDefault(); p.stickers = p.stickers.filter(x => x !== s); selSticker = null; renderStickers(); saveJournal(j); return;
  }
  e.preventDefault();
  if (selSticker !== s.id) { app.querySelectorAll('.sticker.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); selSticker = s.id; }
  const layer = app.querySelector('.sticker-layer'), lr = layer.getBoundingClientRect(), W = layer.clientWidth;
  const cx = lr.left + s.x * W, cy = lr.top + s.y * W;
  const mode = e.target.closest('[data-h]') ? 'resize' : e.target.closest('[data-rot]') ? 'rotate' : 'move';
  const start = {px:e.clientX, py:e.clientY, x:s.x, y:s.y, w:s.w, r:s.r,
    d:Math.hypot(e.clientX - cx, e.clientY - cy) || 1, a:Math.atan2(e.clientY - cy, e.clientX - cx)};
  const move = ev => {
    if (mode === 'move') { s.x = start.x + (ev.clientX - start.px) / W; s.y = Math.max(0, start.y + (ev.clientY - start.py) / W); }
    else if (mode === 'resize') { s.w = Math.max(.05, Math.min(1.2, start.w * Math.hypot(ev.clientX - cx, ev.clientY - cy) / start.d)); }
    else { s.r = Math.round((start.r + (Math.atan2(ev.clientY - cy, ev.clientX - cx) - start.a) * 180 / Math.PI) * 10) / 10; }
    el.style.left = s.x * W + 'px'; el.style.top = s.y * W + 'px'; el.style.width = s.w * W + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${s.r}deg)`;
  };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); saveJournal(j); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
});

function pinPad(title, sub, check){
  let pin = '';

async function importBackup(closeSettings){

  if (!data || !Array.isArray(data.journals)) return toast('That file isn’t a journal backup.');
  const valid = data.journals.filter(j => j && typeof j.id === 'string' && Array.isArray(j.pages));
  if (!confirm(`Restore ${valid.length} journal${valid.length === 1 ? '' : 's'}? Journals with the same name from this backup will replace the ones here.`)) return;
  for (const j of valid) {
    j.pages.forEach(p => { p.stickers = Array.isArray(p.stickers) ? p.stickers : []; p.html = typeof p.html === 'string' ? p.html : ''; });
    if (!isImgData(j.cover)) j.cover = null;
    const i = S.journals.findIndex(x => x.id === j.id);
    if (i >= 0) S.journals[i] = j; else S.journals.push(j);
    await kvSet('j:' + j.id, j);
  }
  if (data.settings && Array.isArray(data.settings.categories)) { S.settings.categories = data.settings.categories.slice(0, 3).map(String); saveSettings(); }

}

function readHash(){
  const m = location.hash.match(/^#cat([123])$/);
  S.fixedCat = m ? Number(m[1]) - 1 : null;
}
window.addEventListener('hashchange', () => { readHash(); if (S.view === 'home') render(); });
(async function init(){
  readHash();
  const all = await kvLoadAll();
  const st = all.get('settings');
  if (st) S.settings = {...DEFAULT_SETTINGS, ...st, categories:(st.categories || DEFAULT_SETTINGS.categories).slice(0, 3)};
  for (const [k, v] of all) if (typeof k === 'string' && k.startsWith('j:') && v && Array.isArray(v.pages)) S.journals.push(v);
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
